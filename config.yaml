market:
  provider: okx
  symbol_map:
    btcusdt: BTC-USDT-SWAP
symbols:
- btcusdt
mode: run
seq_len: 30
input_size: 12
low_gpu_mode: true
infer_cooldown_sec: 0.6
min_push_interval_sec: 180
push_enabled: false
symbol: BTCUSDT
interval: 1m
lookback_hours: 48
future_shift: 5
batch_size: 32
save_interval: 50
confirm:
  need_prob: 0.49
  max_gap_sec: 90
gate:
  min_dir_margin: 0.005
  min_dir_margin_low_vol: 0.015
trading:
  enabled: true
  mode: paper
  venue: futures
  testnet: true
  taker_fee_bp: 2.0
  slippage_bp: 3.0
  base_notional_usd: 100
  leverage: 1
  max_trades_per_hour: 20
  max_daily_loss_bp: 150
  symbol_map:
    btcusdt: BTCUSDT
midtrend:
  enable: false
risk:
  cooldown_seconds: 90
  reverse_guard_seconds: 240
  tp_mult: 2.0
  sl_mult: 1.6
  tp_min: 0.0026
  sl_min: 0.0018
  future_holding: 45
push:
  wecom:
    mode: app
    corp_id: ''
    corp_secret: ''
    agent_id: ''
    to_user: '@all'
low_vol:
  bp: 0.0001
  override_margin: 0.011
  macd_gate: 0.08
  rsi_lo: 30
  rsi_hi: 70
mm:
  enable: true
  gate_mode: relaxed
  min_spread: 0.0001
  imb_th: 0.1
  score_open: 0.22
  score_force: 0.18
  ml_margin: 0.0
  cooldown_s: 12
  k_levels: 3
  lc:
    cancel_build: 0.55
    cancel_cool: 0.42
    add_multi: 1.5
strategy:
  pmin_low_vol_floor: 0.5
  pmin_cap: 0.5599999999999999
