market:
  provider: okx
  symbol_map:
    btcusdt: BTC-USDT-SWAP
symbols:
- btcusdt
mode: run
seq_len: 30
input_size: 12
low_gpu_mode: true
infer_cooldown_sec: 0.6
min_push_interval_sec: 180
push_enabled: false
symbol: BTCUSDT
interval: 1m
lookback_hours: 48
future_shift: 5
batch_size: 32
save_interval: 50
confirm:
  need_prob: 0.55
  max_gap_sec: 45
gate:
  min_dir_margin: 0.04
  min_dir_margin_low_vol: 0.08
trading:
  enabled: true
  mode: paper
  venue: futures
  testnet: true
  taker_fee_bp: 2.0
  slippage_bp: 3.0
  base_notional_usd: 100
  leverage: 1
  max_trades_per_hour: 4
  max_daily_loss_bp: 120
  symbol_map:
    btcusdt: BTCUSDT
midtrend:
  enable: false
risk:
  cooldown_seconds: 90
  reverse_guard_seconds: 240
  tp_mult: 2.0
  sl_mult: 1.6
  tp_min: 0.003
  sl_min: 0.002
  future_holding: 120
push:
  wecom:
    mode: app
    corp_id: ''
    corp_secret: ''
    agent_id: ''
    to_user: '@all'
